<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="VirtOffice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#180728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a760e9"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <circle cx="1130" cy="70" r="150" fill="#8a2be2" opacity="0.06"/>
  <circle cx="150" cy="280" r="190" fill="#a760e9" opacity="0.05"/>
  <g opacity="0.10" stroke="#8a2be2" stroke-width="1.5" fill="none">
    <circle cx="180" cy="160" r="26"/><line x1="206" y1="160" x2="320" y2="160"/>
    <circle cx="346" cy="160" r="34"/><line x1="380" y1="160" x2="494" y2="160"/>
    <circle cx="528" cy="160" r="42"/>
  </g>
  <text x="640" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">VirtOffice</text>
  <text x="640" y="198" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="27" fill="#c7d2e0" text-anchor="middle">Animated 3D virtual office for Hermes AgentOS subagents</text>
  <text x="640" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#a760e9" opacity="0.85" text-anchor="middle"></text>
  <text x="640" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#8a2be2" letter-spacing="3" text-anchor="middle">ONEBYJORAH  ·  JORAHONE NETWORKS</text>
</svg>
